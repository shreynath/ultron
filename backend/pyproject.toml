[project]
name = "ultron-backend"
version = "0.1.0"
description = "Ultron voice API — dictation and zero-shot voice cloning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "pedalboard>=0.9.0",
    "praat-parselmouth>=0.4.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.3.0"]
# MLX-LM is intentionally optional: a fresh API boot must not download models
# or pull a hosted inference dependency.  Install it only on supported Apple
# Silicon machines after placing verified model weights in ULTRON_HOME/models.
local = ["mlx-lm>=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_ollama: optional tests that call a configured Ollama instance",
]
